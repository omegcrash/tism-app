name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20

jobs:
  typecheck-and-test:
    name: Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # intl:compile-if-needed short-circuits under CI (is-ci), so the
      # generated locale modules tsc imports must be built explicitly.
      - name: Compile translations
        run: yarn intl:compile

      - name: Run TypeScript check
        run: yarn typecheck

      - name: Run tests
        run: yarn test --ci
